# PROPOSAL ONLY: the current runner does not load this format.
# Field types, allowed values and examples: ./workflow-fields.zh-CN.md
# permission_mode: default | bypass (bypass requires current-task authorization).
# User-supplied model names are preferences, not availability claims.
# Validate them against the installed CLI/account before any launch.
schema_version: 1
kind: goals-tmux-workflow

# Required contract, not an optional preference. The proposed resolver must
# reject disabling this requirement, including from host/project/task overlays.
disclosure:
  required: true
  before: each_project_skill_use
  channel: user_reply
  include: [loaded_yaml_paths, layer_order, absent_layers, scenario, profile, cli, model, effort, application_mode, config_digest]
  repeat_on_configuration_change: true
  on_no_yaml: explicitly_report_no_yaml_loaded
  on_pinned_task: report_snapshot_and_current_file_difference

execution:
  controller: tmuxctl
  viewer: iterm2
  coordinator_role: delegate_only
  deprecated_controllers: [goals-iterm-skill, iterm_mcp]
  read_project_instructions: true
  dispatch_language: en
  report_language: zh-CN
  translate_results_before_deciding: true
  preserve_raw_result_codes_and_ids: true

tui:
  enabled: true
  terminal: iterm2
  mode: tmux
  keep_open: true
  allow_input: true
  require_visible_proof_before_input: true
  show_tui_remediation_limit: 1
  on_missing_proof: stop_and_report
  show_after_registry_adoption: true

# Named profiles describe intent; adapters compile exact launch/resume argv.
# Do not also maintain a manually synchronized program_argv in each profile.
profiles:
  claude_default:
    cli: claude
    model: opus
    effort: high
    permission_mode: default
  cursor_default:
    cli: cursor
    model: grok-4.7-xhigh
    effort: null  # No separate effort flag requested; model name remains exact.
    permission_mode: default
  codex_default:
    cli: codex
    model: gpt-6-astra
    effort: xhigh
    service_tier: priority
    permission_mode: default
  codex_design:
    cli: codex
    model: gpt-6-astra
    effort: high
    service_tier: priority
    permission_mode: default
  codex_other:
    cli: codex
    model: gpt-6-astra
    effort: low
    service_tier: priority
    permission_mode: default
  codex_sol_fallback:
    cli: codex
    model: gpt-6.1-sol
    # Proposed: the research fallback inherits the declared Codex default effort.
    effort: xhigh
    service_tier: priority
    permission_mode: default
  agy_default:
    cli: agy
    model: gemini-4-argon-high
    effort: high
    permission_mode: default
  agy_flash:
    cli: agy
    model: gemini-3.8-flash-high
    effort: high
    permission_mode: default
  kiro_default:
    cli: kiro
    model: claude-opus-5.5
    effort: high
    # --trust-all-tools requires task-specific bypass authorization.
    permission_mode: default

cli_defaults:
  claude: claude_default
  cursor: cursor_default
  codex: codex_default
  agy: agy_default
  kiro: kiro_default

scenarios:
  research:
    label: 需求调研
    profile: agy_flash
    fallbacks: [cursor_default, codex_sol_fallback]
  design:
    label: 需求设计
    profile: codex_design
    fallbacks: [agy_default]
  test_design:
    label: 测试设计
    profile: agy_default
    fallbacks: []
  implementation:
    label: 需求实现
    profile: agy_flash
    fallbacks: []
  testing:
    label: 需求测试
    profile: agy_flash
    fallbacks: []
  # Reserved UI routes: select a named profile before using these scenarios.
  # null means unconfigured, not inheritance or automatic use of "other".
  ui_prototype_html:
    label: UI 原型设计（HTML）
    profile: null
    fallbacks: []
    allow_fallback: false
  ui_implementation:
    label: UI 实现
    profile: null
    fallbacks: []
    allow_fallback: false
  ui_automation:
    label: UI 自动化
    profile: null
    fallbacks: []
    allow_fallback: false
  review:
    label: 需求 Review
    profile: codex_design
    fallbacks: []
    allow_fallback: false
  other:
    label: 其他场景
    profile: codex_other
    fallbacks: [cursor_default, agy_default, claude_default]

selection:
  on_unknown_scenario: stop_and_report
  fallback_order: listed
  fallback_only_after_confirmed_failure: true
  fallback_while_auto_retrying: false
  fallback_after_uncertain_write: false
  fallback_on_unavailable_model_or_flag: false
  on_unavailable_model_or_flag: report_available_and_request_choice
  explicit_task_choice_disables_unapproved_fallback: true
  fast_mapping: adapter_capability_only

preflight:
  check_runner_capabilities: true
  check_cli_version_and_help: true
  check_exact_model_and_effort: true
  on_unverifiable_capability: stop_and_report
  verify_launch_capture: [cli, model, effort, permission_mode, cwd, prompt_state]
  rename_owned_resources: true

dispatch:
  protocol: private_decision_file
  require_complete_instruction: true
  require_visible_dispatch_id: true
  require_capture_before_submit: true
  submit_operation: submit_dispatch
  require_input_verified: true
  allow_direct_task_paste: false

observation:
  inspect_existing_resources_first: true
  adopt_matching_active_task: true
  wait_method: inline_watch
  max_wait_seconds: 60
  create_scheduled_tasks: false
  reuse_task_and_monitor: true
  while_running_or_retrying: observe_only
  automatic_continue_or_enter: false
  automatic_interrupt: false
  recover_only_after_confirmed_stop: true
  on_uncertain_write: reconcile_before_retry

# Limit same-CLI concurrency across projects, not total tmux task count.
# A CLI instance in each pane consumes one slot, regardless of container layout.
# Linked windows/panes must not be counted twice; retained viewers do not count.
concurrency:
  counting_unit: active_cli_instance
  scope: user_local_host
  default_max_per_cli: 4
  # Optional per-CLI overrides; canonical aliases share the same bucket.
  overrides: {}
  # Example: {codex: 2, agy: 4, cursor: 3}; these values are not enabled here.
  on_limit: wait_for_slot
  on_unknown_liveness: reserve_slot_and_reconcile

constraints:
  tests: targeted
  full_suite: only_when_necessary
  python_reload: false
  routine_decisions: coordinator_within_task_authorization
  on_user_decision_required: preserve_context_and_pause_related_writes

acceptance:
  required_evidence: [pane_capture, project_artifacts, targeted_test_results]
  per_criterion_evidence: true
  cli_claim_is_sufficient: false
  idle_prompt_is_sufficient: false
  api_receipt_is_sufficient: false
  require_monitor_stopped: true

cleanup:
  after_acceptance: close_task_owned_tmux_resources
  settle_task: true
  explain_unsettled_resources: true
  retain_viewer: true

# These restrictions do not grant any operation. The runner's endpoint policy
# and the user's authorization for the current task must independently allow it.
authorization_policy:
  bypass_requires_current_task_authorization: true
  commit_requires_current_task_authorization: true
  push: deny
  publish: deny
  destructive_operations: deny

# Host selection is explicit; repository content cannot select a trusted runner.
hosts:
  trae-cn:
    runner: ~/.trae-cn/skills/goals-tmux-skill/scripts/tmuxctl
