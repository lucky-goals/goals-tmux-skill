# CLI platform configuration (example).
#
# Rules enforced by the loader:
#   - unknown keys are rejected
#   - no credentials: env names or values that look like secrets are refused
#     with SECRET_IN_CONFIG. Credentials stay in the CLI's own login or in a
#     variant's settings file, which is referenced by path and never read.
#   - relative paths resolve against this file's directory
#
# Model ids and efforts below are the curated layer of the catalog. Entries
# for CLIs that are not installed on the verification host (codex, agy) are
# carried from references/cli-adapters.md and stay "unconfirmed" until a host
# with those binaries records an observation.

schema_version = 1

[platform]
state_dir = "~/.local/state/goals-tmux-skill"

[nicknames]
library = "../data/nicknames.txt"
cooldown_days = 7        # a released nickname rests this long before reuse
tmux_prefix = "gt"       # tmux session name: gt-<nickname>, for new sessions only;
                         # existing sessions keep their names

[concurrency]
global_max_parallel = 6
lease_ttl_seconds = 60
heartbeat_seconds = 15
queue_max_depth = 32
queue_timeout_seconds = 1800

[concurrency.rate_limit]
cooldown_base_seconds = 60     # doubles per consecutive rate limit
cooldown_max_seconds = 900
recover_after_turns = 5        # clean turns before the cap grows back by one
# Scopes are global, account, stage and (optional) variant. There is no
# per-model cap and no capacity reservation; neither has a key here.

[catalog]
stale_after_days = 14
allow_unreviewed = false       # observed-only models are not routable

# Display language for messages from the command line and the default for the
# workbench: "auto" (OS locale, then English), "en", "ja" or "zh-Hant".
# Regional tags are accepted and normalized (ja-JP -> ja, zh-TW -> zh-Hant).
# `--locale` overrides it per command; a workbench viewer's own choice
# overrides it in that browser. Codes, ids and logs are never translated.
[ui]
locale = "auto"

# Execution transports (decisions D01, D04, D05). Each turn runs one CLI
# process over one transport, bound before the turn's commit point (the
# fsync of turn_started). Before it, a transport fault may fall back to the
# next allowed transport; after it, never. ACP is used only for a variant
# whose acp_gate is "enabled" (Phase 0 probe, 2026-11-13).
[execution]
transport_order = ["acp", "headless"]
cancel_grace_seconds = 5       # wait for the agent to acknowledge a cancel
close_grace_seconds = 3        # wait for an exit after stdin EOF, then SIGTERM
quiet_timeout_seconds = 600    # a turn with no output this long fails

[execution.acp]
protocol_versions = [1]
handshake_timeout_seconds = 10
setup_timeout_seconds = 30
breaker_consecutive_faults = 2   # the breaker opens after 2 consecutive faults
breaker_window_turns = 10        # ... or 3 of the last 10 ACP turns
breaker_window_faults = 3
breaker_retry_seconds = 1800     # then one trial turn after 30 minutes

# ---------------------------------------------------------------------------
# Accounts: the unit a vendor rate-limits. Variants that bill the same
# subscription share one account and therefore one cap.
# ---------------------------------------------------------------------------

[accounts.anthropic-sub]
vendor = "anthropic"
max_parallel = 2

[accounts.anthropic-gateway]
vendor = "anthropic-compatible gateway"
max_parallel = 2

[accounts.cursor-pro]
vendor = "cursor"
max_parallel = 1

[accounts.kiro-idc]
vendor = "kiro"
max_parallel = 2

[accounts.openai-codex]
vendor = "openai"
max_parallel = 2

[accounts.google-agy]
vendor = "google"
max_parallel = 1

# ---------------------------------------------------------------------------
# Variants: a stable id for binary + settings file + environment + account.
# The id is permanent; it appears in run records and audit entries.
# Optional max_parallel caps one variant on top of its account's cap, for
# example a gateway endpoint with a smaller quota than the account.
#
# Execution keys:
#   transport        auto | acp | headless. An explicit value is strict: it is
#                    never replaced by a fallback.
#   transport_order  optional; overrides [execution].transport_order
#   acp_gate         enabled | verified_not_default | blocked | disabled |
#                    absent | pending. Only "enabled" lets a turn use ACP.
#   env_allow        names the child inherits on top of PATH, HOME, LANG,
#                    LC_ALL, TMPDIR, USER, LOGNAME, SHELL, TERM and XDG_*.
#                    Names only; the values are never written here.
# ---------------------------------------------------------------------------

# Claude Code has no ACP mode: headless only (D02). Its headless auth fails in
# the sanitized environment unless the OAuth token is inherited (probe:
# p0c_claude_headless.json vs p0c_claude_headless_auth.json).
[variants.claude]
adapter = "claude"
binary = "claude"
account = "anthropic-sub"
transport = "headless"
acp_gate = "absent"
env_allow = ["CLAUDE_CODE_OAUTH_TOKEN"]

# Same binary, different API endpoint. The base URL and its credential live in
# the settings file; this file only points at it.
[variants.claude-gateway]
adapter = "claude"
binary = "claude"
account = "anthropic-gateway"
settings_file = "../../gateway.json"
env = { CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1" }
env_unset = ["ANTHROPIC_API_KEY"]
transport = "headless"
acp_gate = "absent"
# No env_allow: the gateway's credential comes from its settings file, and the
# subscription token must not reach this variant.
note = "Launches as: claude --settings <path>. The file must be owner-only (0600)."

# ACP disabled: session/load answers -32602 and sessions are not portable
# between transports (gate check 3 fails). A passing handshake is not enough.
[variants.cursor]
adapter = "cursor"
binary = "agent"
account = "cursor-pro"
transport = "headless"
acp_gate = "disabled"

# ACP v2 permission flow verified, but v3 (the default engine) is blocked by a
# parse error in the user's ~/.kiro/settings/permissions.yaml, which the
# platform never edits. Headless until v3 passes.
[variants.kiro]
adapter = "kiro"
binary = "kiro-cli"
account = "kiro-idc"
transport = "headless"
acp_gate = "blocked"

[variants.codex]
adapter = "codex"
binary = "codex"
account = "openai-codex"
transport = "headless"
acp_gate = "pending"

# The first ACP-enabled adapter: handshake, prompt, resume both ways, cancel
# and subagent wait verified. It cannot serve read_only_auto stages: in
# default mode it ran commands without asking.
[variants.agy]
adapter = "agy"
binary = "agy"
account = "google-agy"
transport = "auto"
transport_order = ["acp", "headless"]
acp_gate = "enabled"

# ---------------------------------------------------------------------------
# Models (curated overlay). display_name, context_tokens and cost_tier are
# shown to people choosing a model; the router does not read them. Leave
# context_tokens and cost_tier unset until they are verified.
# ---------------------------------------------------------------------------

[[models]]
variant = "claude"
id = "opus"
display_name = "Claude Opus"
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
verified_at = "2026-11-13"
note = "Alias and effort levels from `claude --help` 2.1.311."

[[models]]
variant = "claude"
id = "sonnet"
display_name = "Claude Sonnet"
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "medium"
verified_at = "2026-11-13"

[[models]]
variant = "claude"
id = "fable"
display_name = "Claude Fable"
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
verified_at = "2026-11-13"

[[models]]
variant = "claude-gateway"
id = "opus"
display_name = "Opus via gateway"
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
note = "The settings file decides which upstream model the alias maps to."

[[models]]
variant = "claude-gateway"
id = "sonnet"
display_name = "Sonnet via gateway"
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "medium"

[[models]]
variant = "cursor"
id = "grok-4.7-xhigh"
display_name = "Grok 4.7 xhigh (Cursor)"
note = "Cursor has no effort flag; the effort is part of the model id."

[[models]]
variant = "kiro"
id = "@default"
display_name = "Kiro default model"
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
verified_at = "2026-11-13"
note = "No --model is passed. Effort levels from `kiro-cli chat --help` 2.34.0."

[[models]]
variant = "codex"
id = "gpt-6.1-sol"
display_name = "GPT-6.1 Sol"
efforts = ["low", "medium", "high", "xhigh"]
default_effort = "high"
note = "From references/cli-adapters.md; codex is not installed on the verification host."

[[models]]
variant = "agy"
id = "gemini-4-argon-high"
display_name = "Gemini 4 Argon high"
efforts = ["high"]
default_effort = "high"
note = "From references/cli-adapters.md; agy is not installed on the verification host."

# ---------------------------------------------------------------------------
# Stages: an ordered list. Add, remove or reorder [[stages]] entries to match
# how a role splits its work; the order is the order the workbench shows.
# Each stage has ordered candidates (first usable wins), a stage cap, a
# fallback policy and a permission_profile passed to the CLI at launch:
#   bypass          skip permission prompts for the turn
#   read_only_auto  auto-approve read, search and fetch only; never execute
#                   commands
# The CLI's own permission configuration is never modified. Built-in stage
# ids default to bypass, except code_review, which defaults to read_only_auto;
# a stage with any other id must set permission_profile.
# on_busy = "queue" waits for the preferred account; "next" tries the
# following candidate when only that account is busy.
# ---------------------------------------------------------------------------

[[stages]]
id = "design"
permission_profile = "bypass"
max_parallel = 2
on_busy = "queue"
candidates = [
  { variant = "claude", model = "opus", effort = "max" },
  { variant = "claude-gateway", model = "opus", effort = "high" },
  { variant = "codex", model = "gpt-6.1-sol", effort = "xhigh" },
]

[[stages]]
id = "development"
permission_profile = "bypass"
max_parallel = 3
on_busy = "queue"
candidates = [
  { variant = "claude", model = "opus", effort = "high" },
  { variant = "codex", model = "gpt-6.1-sol", effort = "high" },
  { variant = "cursor", model = "grok-4.7-xhigh" },
  { variant = "kiro", model = "@default", effort = "high" },
]

[[stages]]
id = "testing"
permission_profile = "bypass"
max_parallel = 2
on_busy = "next"
candidates = [
  { variant = "claude", model = "sonnet", effort = "medium" },
  { variant = "kiro", model = "@default", effort = "medium" },
  { variant = "cursor", model = "grok-4.7-xhigh" },
]

# Review prefers a different vendor from the one that wrote the code, and
# only reads: read_only_auto never executes commands.
[[stages]]
id = "code_review"
permission_profile = "read_only_auto"
max_parallel = 2
on_busy = "next"
candidates = [
  { variant = "codex", model = "gpt-6.1-sol", effort = "xhigh" },
  { variant = "cursor", model = "grok-4.7-xhigh" },
  { variant = "claude-gateway", model = "opus", effort = "high" },
]

[[stages]]
id = "ui_design"
permission_profile = "bypass"
max_parallel = 1
on_busy = "queue"
candidates = [
  { variant = "agy", model = "gemini-4-argon-high", effort = "high" },
  { variant = "claude", model = "opus", effort = "high" },
  { variant = "cursor", model = "grok-4.7-xhigh" },
]

[routing]
# Last resort for any stage whose own list has no usable candidate.
default_candidates = [
  { variant = "claude", model = "sonnet", effort = "medium" },
]
